; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_circuitplayground_m0]
platform = atmelsam
board = adafruit_circuitplayground_m0
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Adafruit_Circuit_Playground_Expresso_06646DA4504E5350312E314AFF08091A-if00
build_flags =
	-Wl,-u,_printf_float
lib_extra_dirs = ../common
lib_ignore = 
	Adafruit TinyUSB Library
	Adafruit Zero PDM Library
	Adafruit Zero FFT Library
lib_deps = adafruit/Adafruit Circuit Playground@^1.12.0
